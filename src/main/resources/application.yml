server:
  port: ${GOVERNANCE_PORT:8080}

spring:
  application:
    name: ai-runtime-governance
  datasource:
    url: ${GOVERNANCE_DB_URL:jdbc:postgresql://127.0.0.1:55434/governance}
    username: ${GOVERNANCE_DB_USER:postgres}
    password: ${GOVERNANCE_DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
  mail:
    host: ${GOVERNANCE_SMTP_HOST:127.0.0.1}
    port: ${GOVERNANCE_SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

governance:
  base-url: ${GOVERNANCE_BASE_URL:http://127.0.0.1:5173}
  admin:
    allowed-os-users: ${GOVERNANCE_ADMIN_USERS:${user.name}}
  trusted-proxies: ${GOVERNANCE_TRUSTED_PROXIES:}
  test-control:
    enabled: ${GOVERNANCE_TEST_CONTROL:false}
    token: ${GOVERNANCE_TEST_TOKEN:}
  gateway:
    enabled: ${GOVERNANCE_GATEWAY_ENABLED:true}
    public-base-url: ${GOVERNANCE_GATEWAY_PUBLIC_BASE_URL:}
    upstream-base-url: ${GOVERNANCE_UPSTREAM_BASE_URL:}
    upstream-api-key: ${GOVERNANCE_UPSTREAM_API_KEY:}
    upstream-organization: ${GOVERNANCE_UPSTREAM_ORGANIZATION:}
    upstream-project: ${GOVERNANCE_UPSTREAM_PROJECT:}
    models: ${GOVERNANCE_GATEWAY_MODELS:}
    max-active-keys: ${GOVERNANCE_GATEWAY_MAX_KEYS:5}
    max-request-bytes: ${GOVERNANCE_GATEWAY_MAX_REQUEST_BYTES:2097152}
    max-capture-bytes: ${GOVERNANCE_GATEWAY_MAX_CAPTURE_BYTES:2097152}
    max-concurrent-upstream: ${GOVERNANCE_GATEWAY_MAX_CONCURRENT:8}
    connect-timeout-seconds: ${GOVERNANCE_GATEWAY_CONNECT_TIMEOUT:10}
    request-timeout-seconds: ${GOVERNANCE_GATEWAY_REQUEST_TIMEOUT:120}
    conversation-ttl-seconds: ${GOVERNANCE_GATEWAY_CONVERSATION_TTL:3600}
    requests-per-minute: ${GOVERNANCE_GATEWAY_REQUESTS_PER_MINUTE:60}
    allow-unguarded-continuation: ${GOVERNANCE_GATEWAY_ALLOW_UNGUARDED_CONTINUATION:false}
  langfuse:
    enabled: ${LANGFUSE_ENABLED:false}
    base-url: ${LANGFUSE_BASE_URL:https://cloud.langfuse.com}
    public-key: ${LANGFUSE_PUBLIC_KEY:}
    secret-key: ${LANGFUSE_SECRET_KEY:}
    capture-input: ${LANGFUSE_CAPTURE_INPUT:true}
    capture-output: ${LANGFUSE_CAPTURE_OUTPUT:true}
    queue-capacity: ${LANGFUSE_QUEUE_CAPACITY:1000}
    timeout-seconds: ${LANGFUSE_TIMEOUT_SECONDS:5}
