governance:
  iam:
    mode: keycloak
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:8180/realms/arg}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:arg-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    google-client-id: ${GOOGLE_CLIENT_ID:}

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_BFF_CLIENT_ID:arg-bff}
            client-secret: ${KEYCLOAK_BFF_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/keycloak/callback"
            scope: openid,profile,email
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:8180/realms/arg}
  session:
    jdbc:
      initialize-schema: never
